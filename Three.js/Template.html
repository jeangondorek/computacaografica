<!doctype html>
<html lang="en">
<head>
    <title>Template (Three.js)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel=stylesheet href="css/base.css"/>
</head>
<body>

<script src="js/Three.js"></script>
<script src="js/Detector.js"></script>
<script src="js/Stats.js"></script>
<script src="js/OrbitControls.js"></script>
<script src="js/KeyboardState.js"></script>
<script src="js/THREEx.FullScreen.js"></script>
<script src="js/THREEx.WindowResize.js"></script>

<!-- Code to display an information button and box when clicked. -->
<script src="js/jquery-1.9.1.js"></script>
<script src="js/jquery-ui.js"></script>
<link rel=stylesheet href="css/jquery-ui.css" />
<link rel=stylesheet href="css/info.css"/>
<script src="js/info.js"></script>
<div id="infoButton"></div>
<div id="infoBox" title="Demo Information">
This three.js demo is part of a collection at
<a href="http://stemkoski.github.io/Three.js/">http://stemkoski.github.io/Three.js/</a>
</div>
<!-- ------------------------------------------------------------ -->

<div id="ThreeJS" style="position: absolute; left:0px; top:0px"></div>
<script>
/*
	Three.js "tutorials by example"
	Author: Lee Stemkoski
	Date: July 2013 (three.js v59dev)
 */

// MAIN

// standard global variables
var container, scene, camera, renderer, controls, stats;
var keyboard = new KeyboardState();
var clock = new THREE.Clock();

// custom global variables
var mesh;
var lineBox;
var lightMovements;
var something, something2;


init();
animate();

// FUNCTIONS 		
function init() 
{
	// SCENE
	scene = new THREE.Scene();
	// CAMERA
	var SCREEN_WIDTH = window.innerWidth, SCREEN_HEIGHT = window.innerHeight;
	var VIEW_ANGLE = 45, ASPECT = SCREEN_WIDTH / SCREEN_HEIGHT, NEAR = 0.1, FAR = 20000;
	camera = new THREE.PerspectiveCamera( VIEW_ANGLE, ASPECT, NEAR, FAR);
	scene.add(camera);
	camera.position.set(0,150,600);
	camera.lookAt(scene.position);	
	// RENDERER
	if ( Detector.webgl )
		renderer = new THREE.WebGLRenderer( {antialias:true} );
	else
		renderer = new THREE.CanvasRenderer(); 
	renderer.setSize(SCREEN_WIDTH, SCREEN_HEIGHT);
	container = document.getElementById( 'ThreeJS' );
	container.appendChild( renderer.domElement );
	// EVENTS
	THREEx.WindowResize(renderer, camera);
	THREEx.FullScreen.bindKey({ charCode : 'm'.charCodeAt(0) });
	// CONTROLS
	controls = new THREE.OrbitControls( camera, renderer.domElement );
	// STATS
	stats = new Stats();
	stats.domElement.style.position = 'absolute';
	stats.domElement.style.bottom = '0px';
	stats.domElement.style.zIndex = 100;
	container.appendChild( stats.domElement );
	// LIGHT
	var light = new THREE.PointLight(0xffffff)	;
	light.position.set(0,0,0);
	scene.add(light);
	// FLOOR
	var floorTexture = new THREE.ImageUtils.loadTexture( 'images/checkerboard.jpg' );
	floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping; 
	floorTexture.repeat.set( 120, 120 );
	var floorMaterial = new THREE.MeshBasicMaterial( { map: floorTexture, side: THREE.DoubleSide } );
	var floorGeometry = new THREE.PlaneGeometry(10000, 10000, 10, 10);
	var floor = new THREE.Mesh(floorGeometry, floorMaterial);
	floor.position.y = -0.5;
	floor.rotation.x = Math.PI / 2;
	scene.add(floor);
	// SKYBOX
	var skyBoxGeometry = new THREE.CubeGeometry( 10000, 10000, 10000 );
	var skyBoxMaterial = new THREE.MeshBasicMaterial( { color: 0x099078, side: THREE.BackSide } );
	var skyBox = new THREE.Mesh( skyBoxGeometry, skyBoxMaterial );
	scene.add(skyBox);
	
	////////////
	// CUSTOM //
	////////////

	var something = new THREE.CubeGeometry( 50, 50, 50);
	var material = new THREE.MeshLambertMaterial( { color: 0xffffff } );
	mesh = new THREE.Mesh( something, material );
	mesh.position.set(0,150,0);
	scene.add(mesh);

	const geometry = new THREE.TorusGeometry( 100, 10, 50, 8 );
	const material2 = new THREE.MeshBasicMaterial( { color: 0xffff00, side: THREE.DoubleSide } );

	// Atribuir diretamente à variável global (sem o "var" na frente)
	lineBox = new THREE.Mesh( geometry, material2 );
	lineBox.position.set(0,150,0); 
	scene.add( lineBox );

	// CRIAR A LUZ DINÂMICA (COR AZULADA OU BRANCA FORTE PARA CONTRASTAR)
	lightMovements = new THREE.PointLight(0x00aaff, 2, 300); 
	// Afastamos a luz do centro (colocando na borda do aro de raio 100)
	lightMovements.position.set(100, 0, 0); 
	
	// ADICIONAR A LUZ DENTRO DO ARO
	lineBox.add( lightMovements );	



	const a = new THREE.Vector3( 0, 1, 0 );
	//no arguments; will be initialised to (0, 0, 0)
	const b = new THREE.Vector3( );
	const d = a.distanceTo( b );


}

function animate() 
{
    requestAnimationFrame( animate );
	render();		
	update();
}

function update()
{
	keyboard.update();
	// Define a velocidade do movimento
	var moveDistance = 5; 
	var rotateAngle = 0.03; 

	// Mover para a esquerda (Seta Esquerda)
	if ( keyboard.pressed("left") || keyboard.pressed("A") ) 
	{	  
		lineBox.position.x -= moveDistance;
	}
	
	// Mover para a direita (Seta Direita)
	if ( keyboard.pressed("right") || keyboard.pressed("D")  ) 
	{	  
		lineBox.position.x += moveDistance;
	}
	
	// Mover para frente/afastar (Seta para Cima)
	if ( keyboard.pressed("up") || keyboard.pressed("W")  ) 
	{	  
		lineBox.position.z -= moveDistance;
	}
	
	// Mover para trás/aproximar (Seta para Baixo)
	if ( keyboard.pressed("down") || keyboard.pressed("S")  ) 
	{	  
		lineBox.position.z += moveDistance;
	}

	// Tecla 8: Inclina para baixo (Gira no eixo X)
	if ( keyboard.pressed("R") ) 
	{	  
		lineBox.rotation.x += rotateAngle;
	}
	
	// Tecla 2: Inclina para cima (Gira no eixo X)
	if ( keyboard.pressed("F") ) 
	{	  
		lineBox.rotation.x -= rotateAngle;
	}
	
	// Tecla 4: Inclina/Rola para a esquerda (Gira no eixo Z)
	if ( keyboard.pressed("Q") ) 
	{	  
		lineBox.rotation.z += rotateAngle;
	}
	
	// Tecla 6: Inclina/Rola para a direita (Gira no eixo Z)
	if ( keyboard.pressed("E") ) 
	{	  
		lineBox.rotation.z -= rotateAngle;
	}
	
	controls.update();
	stats.update();
}


function render() 
{
	renderer.render( scene, camera );
}

</script>

</body>
</html>
